<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f6f8;
      color: #1e293b;
    }
    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 28px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
    }
    h1 { margin: 0 0 6px; font-size: 26px; color: #0f172a; }
    p.subtitle { margin: 0 0 24px; color: #64748b; font-size: 14px; }
    
    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 18px 20px;
      border-radius: 8px;
    }
    .stat-title { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 28px; font-weight: 800; margin-top: 6px; }
    .stat-students { color: #1e40af; }
    .stat-courses { color: #047857; }
    .stat-gpa { color: #b45309; }

    /* Alert Message */
    .alert {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 500;
      display: none;
    }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block; }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }

    /* Form */
    form {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      background: #fafafa;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      margin-bottom: 30px;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }
    input, select {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus, select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .form-actions {
      grid-column: span 3;
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-primary { background: #1e40af; color: white; }
    .btn-primary:hover { background: #1e3a8a; }
    .btn-cancel { background: #e2e8f0; color: #334155; }
    .btn-cancel:hover { background: #cbd5e1; }

    /* Table */
    h2 { font-size: 20px; color: #0f172a; margin: 0 0 14px; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
    }
    th {
      background: #eaf1f7;
      color: #1e3a8a;
      font-weight: 700;
    }
    tbody tr:hover { background: #f8fafc; }
    .btn-action {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 4px;
      margin-right: 6px;
    }
    .btn-edit { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .btn-edit:hover { background: #bae6fd; }
    .btn-delete { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .btn-delete:hover { background: #fecaca; }

    @media (max-width: 768px) {
      form { grid-template-columns: 1fr; }
      .form-actions { grid-column: span 1; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Student Management System</h1>
    <p class="subtitle">Full-Stack Lab Application | Node.js, Express.js & MongoDB</p>

    <!-- Stats summary -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">Total Enrolled Students</div>
        <div class="stat-value stat-students" id="stat-count">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Total Departments / Courses</div>
        <div class="stat-value stat-courses" id="stat-courses">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Overall Average GPA</div>
        <div class="stat-value stat-gpa" id="stat-gpa">0.00</div>
      </div>
    </div>

    <!-- Alert status banner -->
    <div id="alertBox" class="alert"></div>

    <!-- Student Form -->
    <form id="studentForm">
      <label>
        STUDENT ID
        <input type="text" id="studentId" name="studentId" placeholder="e.g. STU-101" required>
      </label>
      <label>
        FULL NAME
        <input type="text" id="name" name="name" placeholder="e.g. Alice Johnson" required>
      </label>
      <label>
        EMAIL
        <input type="email" id="email" name="email" placeholder="e.g. alice@univ.edu" required>
      </label>
      <label>
        COURSE / DEPARTMENT
        <input type="text" id="course" name="course" placeholder="e.g. Computer Science" required>
      </label>
      <label>
        AGE
        <input type="number" id="age" name="age" min="1" max="120" placeholder="e.g. 20" required>
      </label>
      <label>
        GPA (0.0 - 4.0)
        <input type="number" id="gpa" name="gpa" min="0" max="4.0" step="0.01" placeholder="e.g. 3.85" required>
      </label>
      <div class="form-actions">
        <button type="submit" id="submitBtn" class="btn-primary">Add Student</button>
        <button type="button" id="cancelBtn" class="btn-cancel" style="display:none;">Cancel Edit</button>
      </div>
    </form>

    <!-- Student Table -->
    <h2>Enrolled Student Records</h2>
    <table>
      <thead>
        <tr>
          <th>Student ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Course</th>
          <th>Age</th>
          <th>GPA</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="studentTableBody">
        <tr>
          <td colspan="7" style="text-align: center; color: #64748b;">Loading students...</td>
        </tr>
      </tbody>
    </table>
  </main>

  <script>
    const API = '/api/students';
    let editingId = null;

    function showAlert(msg, isSuccess = true) {
      const box = document.getElementById('alertBox');
      box.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
      box.textContent = msg;
      setTimeout(() => { box.className = 'alert'; }, 5000);
    }

    async function loadStats(students = []) {
      try {
        const res = await fetch('/api/reports/course-summary');
        if (res.ok) {
          const data = await res.json();
          let totalCount = 0;
          let weightedGpa = 0;
          data.forEach(item => {
            totalCount += item.studentCount;
            weightedGpa += (item.averageGpa * item.studentCount);
          });

          document.getElementById('stat-count').textContent = totalCount;
          document.getElementById('stat-courses').textContent = data.length;
          document.getElementById('stat-gpa').textContent = totalCount > 0 ? (weightedGpa / totalCount).toFixed(2) : "0.00";
          return;
        }
      } catch (e) {
        console.warn('Aggregation route error, falling back to local calculation:', e);
      }

      // Robust fallback calculation directly from loaded student documents
      if (students && students.length > 0) {
        const totalCount = students.length;
        const uniqueCourses = new Set(students.map(s => (s.course || '').trim().toLowerCase()));
        const sumGpa = students.reduce((acc, s) => acc + (Number(s.gpa) || 0), 0);

        document.getElementById('stat-count').textContent = totalCount;
        document.getElementById('stat-courses').textContent = uniqueCourses.size;
        document.getElementById('stat-gpa').textContent = (sumGpa / totalCount).toFixed(2);
      }
    }

    async function loadStudents() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error('Failed to fetch students');
        const json = await res.json();
        const students = json.data || [];
        
        const tbody = document.getElementById('studentTableBody');
        if (students.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #64748b;">No student records found. Add one above!</td></tr>';
          document.getElementById('stat-count').textContent = "0";
          document.getElementById('stat-courses').textContent = "0";
          document.getElementById('stat-gpa').textContent = "0.00";
          return;
        }

        tbody.innerHTML = students.map(s => `
          <tr>
            <td><strong>${s.studentId}</strong></td>
            <td>${s.name}</td>
            <td>${s.email}</td>
            <td>${s.course}</td>
            <td>${s.age}</td>
            <td>${Number(s.gpa).toFixed(2)}</td>
            <td>
              <button class="btn-action btn-edit" onclick='startEdit(${JSON.stringify(s)})'>Edit</button>
              <button class="btn-action btn-delete" onclick="deleteStudent('${s._id}')">Delete</button>
            </td>
          </tr>
        `).join('');

        loadStats(students);
      } catch (err) {
        showAlert(err.message, false);
      }
    }

    function startEdit(student) {
      editingId = student._id;
      document.getElementById('studentId').value = student.studentId;
      document.getElementById('studentId').disabled = true;
      document.getElementById('name').value = student.name;
      document.getElementById('email').value = student.email;
      document.getElementById('course').value = student.course;
      document.getElementById('age').value = student.age;
      document.getElementById('gpa').value = student.gpa;

      document.getElementById('submitBtn').textContent = 'Update Student';
      document.getElementById('cancelBtn').style.display = 'inline-block';
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('studentForm').reset();
      document.getElementById('studentId').disabled = false;
      document.getElementById('submitBtn').textContent = 'Add Student';
      document.getElementById('cancelBtn').style.display = 'none';
    }

    document.getElementById('cancelBtn').addEventListener('click', cancelEdit);

    document.getElementById('studentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        studentId: document.getElementById('studentId').value.trim(),
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        course: document.getElementById('course').value.trim(),
        age: Number(document.getElementById('age').value),
        gpa: Number(document.getElementById('gpa').value),
      };

      const url = editingId ? `${API}/${editingId}` : API;
      const method = editingId ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || data.message || 'Operation failed');
        }

        showAlert(editingId ? 'Student updated successfully!' : 'Student added successfully!');
        cancelEdit();
        loadStudents();
      } catch (err) {
        showAlert(err.message, false);
      }
    });

    async function deleteStudent(id) {
      if (!confirm('Are you sure you want to delete this student record?')) return;
      try {
        const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to delete');
        showAlert('Student record deleted successfully!');
        loadStudents();
      } catch (err) {
        showAlert(err.message, false);
      }
    }

    // Initialize
    loadStudents();
  </script>
</body>
</html>
